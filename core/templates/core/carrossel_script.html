<script>
    const track = document.getElementById('formation-track');
    const previous = document.getElementById('formation-prev');
    const next = document.getElementById('formation-next');

    if (previous && next) {
        const updateButtons = () => {
            previous.disabled = track.scrollLeft <= 1;
            next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
        };
        const move = (direction) => {
            const [first, second] = track.querySelectorAll('.formation-slide');
            const distance = second.offsetLeft - first.offsetLeft;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            track.scrollBy({left: direction * distance, behavior: reducedMotion ? 'instant' : 'smooth'});
        };
        previous.addEventListener('click', () => move(-1));
        next.addEventListener('click', () => move(1));
        track.addEventListener('scroll', updateButtons, {passive: true});
        window.addEventListener('resize', updateButtons);
        updateButtons();
    }
</script>
