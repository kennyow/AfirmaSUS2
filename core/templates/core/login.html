<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AfirmaSUS-JP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="card card-login bg-white">
        <h3 class="text-center mb-4" style="color: #4C2059;">🔒 Acesso Restrito</h3>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-field form-control" id="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-field form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn w-100 text-white" style="background-color: #4C2059;">Entrar no Sistema</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'home' %}" class="text-secondary text-decoration-none small">← Voltar para a página inicial</a>
        </div>
    </div>

</body>
</html>
