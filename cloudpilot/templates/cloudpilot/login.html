{% extends 'cloudpilot/base.html' %}
{% block content %}
<section class="panel">
  <h1>Entrar</h1>
  <p>Use sua conta autorizada para enviar arquivos.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
