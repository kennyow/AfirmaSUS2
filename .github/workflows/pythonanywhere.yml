name: Publicar no PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar automação
        run: python -m unittest scripts.test_deploy_pythonanywhere -v
      - name: Validar e coletar arquivos estáticos
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: build-only-key-with-more-than-fifty-characters-never-used-on-server
          DJANGO_ALLOWED_HOSTS: kennyow.pythonanywhere.com
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
      - name: Publicar código e recarregar site
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python scripts/deploy_pythonanywhere.py
